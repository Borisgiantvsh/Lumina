name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract zip file properly
        run: |
          if [ -f "lumina.zip" ]; then
            mkdir -p temp_unzip
            unzip -q -o lumina.zip -d temp_unzip
            
            # Otomatis deteksi folder apa pun di dalam zip dan ratain ke root
            shopt -s dotglob
            FIRST_DIR=$(ls -d temp_unzip/* | head -n 1)
            if [ -d "$FIRST_DIR" ]; then
              cp -rf "$FIRST_DIR"/* .
            else
              cp -rf temp_unzip/* .
            fi
            rm -rf temp_unzip
          fi

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
