name: lumina
description: A plugin-driven YouTube Music client with an Apple Music-inspired interface.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Playback
  just_audio: ">=0.9.40 <0.11.0"
  audio_service: ^0.18.18
  just_audio_media_kit: ^2.1.0 # libmpv backend for Windows + Linux
  media_kit_libs_windows_audio: any
  media_kit_libs_linux: any

  # Sources and plugins
  youtube_explode_dart: ^3.1.0
  http: ^1.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
